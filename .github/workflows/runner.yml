name: Runner

on:
  schedule:
    # Script dijalankan tiap jam 11:00 UTC (18:00 WIB)
    # Weekday (1-5) only
    - cron: "00 11 * * 1-5"

  push:
    branches: [master, selenium]

jobs:
  Tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Clone wildangunawan/Dataset-Saham-IDX
        uses: GuillaumeFalourd/clone-github-repo-action@v1
        with:
          owner: "wildangunawan"
          repository: "Dataset-Saham-IDX"

      - name: "Setup chromedriver"
        uses: nanasess/setup-chromedriver@v1
        run: |
          export DISPLAY=:99
          chromedriver --url-base=/wd/hub &
          sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 & # optional

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run get-list-emiten.py
        run: python get-list-emiten.py

      - name: Check working directory
        run: |
          ls .

      - name: Check working retrieved data
        run: |
          ls "./data/List Emiten"
