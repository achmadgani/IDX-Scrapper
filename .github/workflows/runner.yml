name: Runner

on:
  schedule:
    # Script dijalankan tiap jam 11:00 UTC (18:00 WIB)
    # Weekday (1-5) only
    - cron: "00 11 * * 1-5"

  push:
    branches: [master, selenium]

jobs:
  Runner:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./src

    steps:
      - uses: actions/checkout@v2

      - name: Clone wildangunawan/Dataset-Saham-IDX into data folder
        run: git clone https://github.com/wildangunawan/Dataset-Saham-IDX.git data

      - name: "Setup chromedriver"
        uses: nanasess/setup-chromedriver@v1
      - run: chromedriver --url-base=/wd/hub &

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run get-list-emiten.py
        run: python get-list-emiten.py

      # - name: Run get-data-emiten.py
      #   run: python get-data-emiten.py

      - name: Check data directory
        run: ls ./data

      - name: Set current date as env variable
        run: echo "NOW::$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Pushes to another repository
        run: |
          cd data
          git config --global user.name "Wildan Gunawan"
          git config --global user.email $USER_EMAIL

          git add .
          git commit -m "Update data for $NOW"
          git push https://$PAT_GITHUB@github.com/wildangunawan/Dataset-Saham-IDX.git
        env:
          PAT_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
